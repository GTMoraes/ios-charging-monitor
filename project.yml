name: ChargeSpeed
options:
  bundleIdPrefix: com.gregwilson
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ChargeSpeed:
    type: application
    platform: iOS
    sources:
      - ChargeSpeed
      - Shared
    dependencies:
      - target: ChargeSpeedLiveActivity
        embed: true
    info:
      path: ChargeSpeed/Info.plist
      properties:
        CFBundleDisplayName: ChargeSpeed
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - fetch
          - processing
          - location
        NSLocationWhenInUseUsageDescription: >-
          O ChargeSpeed nao usa a sua localizacao. A permissao existe apenas
          porque o iOS nao oferece outro modo de manter o app medindo os sensores
          de carga com a tela apagada. Nenhuma coordenada e lida, guardada ou
          enviada, e o servico fica ativo somente enquanto o carregador esta
          conectado.
        BGTaskSchedulerPermittedIdentifiers:
          - com.gregwilson.chargespeed.refresh
          - com.gregwilson.chargespeed.processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregwilson.chargespeed
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MD8FHBP25M
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ChargeSpeed/ChargeSpeed-Bridging-Header.h

  ChargeSpeedLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ChargeSpeedLiveActivity
      - Shared
    info:
      path: ChargeSpeedLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ChargeSpeed
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gregwilson.chargespeed.LiveActivity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MD8FHBP25M
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

schemes:
  ChargeSpeed:
    build:
      targets:
        ChargeSpeed: all
